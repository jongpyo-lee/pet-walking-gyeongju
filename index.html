<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경주 맞춤 반려견 산책 앱</title>
  
  <!-- Leaflet 지도 라이브러리 CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>🐾 경주 맞춤 반려견 산책 앱</h1>
  </header>

  <main>
    <!-- 지도 영역 -->
    <section id="map-container">
      <div id="map"></div>
    </section>

    <!-- 현위치 조회 -->
    <section class="card current-loc-card">
      <button id="btn-current-location" onclick="showCurrentLocation()">📍 내 현위치 조회</button>
      <p id="gps-status" class="info-text">버튼을 누르면 현재 GPS 위치를 지도에 표시합니다.</p>
    </section>

    <!-- 코스 추천 및 맞춤 코스 생성 -->
    <section class="card">
      <h2>🎯 맞춤 산책 코스 추천 & 직접 만들기</h2>
      
      <!-- 1. 주소 입력 검색 -->
      <div class="form-group">
        <label for="address-input"><b>1. 출발지 주소 검색 (도로명 / 지번)</b></label>
        <div class="search-input-group">
          <input type="text" id="address-input" placeholder="예: 황남동 172 또는 포석로 1080" value="경주시 황남동">
          <button type="button" onclick="searchAddress()">검색</button>
        </div>
        <p id="address-result-info" class="sub-text"></p>
      </div>

      <!-- 2. 산책 형태 (편도/왕복) -->
      <div class="form-group">
        <label><b>2. 코스 형태 선택</b></label>
        <div class="button-group type-group">
          <button type="button" class="btn-type active" onclick="selectType('왕복')">🔄 왕복 코스</button>
          <button type="button" class="btn-type" onclick="selectType('편도')">➡️ 편도 코스</button>
        </div>
      </div>

      <!-- 3. 목표 선택 -->
      <div class="form-group">
        <label><b>3. 산책 목표 선택</b></label>
        <div class="button-group target-group">
          <button type="button" class="btn-target active" onclick="selectTarget('30분')">⏱️ 30분</button>
          <button type="button" class="btn-target" onclick="selectTarget('1시간')">⏱️ 1시간</button>
          <button type="button" class="btn-target" onclick="selectTarget('3km')">📏 3km</button>
          <button type="button" class="btn-target" onclick="selectTarget('5km')">📏 5km</button>
        </div>
      </div>

      <div class="action-btn-group">
        <button type="button" onclick="recommendCourse()" class="btn-primary">🔍 도로 기준 코스 추천받기</button>
        <button type="button" onclick="toggleCustomCourseMode()" id="btn-custom-mode" class="btn-secondary">✏️ 지도로 나만의 코스 직접 만들기</button>
      </div>

      <!-- 수동 코스 생성 모드 안내 바 -->
      <div id="custom-course-banner" class="custom-banner" style="display:none;">
        <p><b>[직접 만들기 모드 작동 중]</b><br>지도를 클릭하여 경유 지점들을 찍어주세요.</p>
        <div class="button-group sub-group">
          <button type="button" onclick="undoLastCustomPoint()">↩️ 이전 점 취소</button>
          <button type="button" onclick="finishCustomCourse()">✅ 나만의 코스 완성</button>
          <button type="button" onclick="cancelCustomCourse()">❌ 취소</button>
        </div>
      </div>

      <!-- 추천/생성 결과 영역 -->
      <div id="recommend-result" class="result-box" style="display:none;">
        <h3 id="result-title"></h3>
        <p id="result-desc"></p>
      </div>
    </section>

    <!-- 산책 기록 -->
    <section class="card">
      <h2>📝 오늘의 산책 기록하기</h2>
      <form id="walk-form">
        <div class="form-group">
          <label for="dog-name">반려견 이름</label>
          <input type="text" id="dog-name" placeholder="예: 초코" required>
        </div>
        <div class="form-group">
          <label for="walk-time">산책 시간 (분)</label>
          <input type="number" id="walk-time" placeholder="예: 30" required>
        </div>
        <div class="form-group">
          <label for="walk-distance">산책 거리 (km)</label>
          <input type="number" step="0.1" id="walk-distance" placeholder="예: 2.5">
        </div>
        <div class="form-group">
          <label for="walk-memo">산책 일지/메모</label>
          <textarea id="walk-memo" rows="3" placeholder="오늘 추천 코스나 직접 만든 코스는 어땠나요? 소감을 적어보세요."></textarea>
        </div>
        <button type="submit" class="btn-submit">기록 저장하기</button>
      </form>
    </section>

    <!-- 저장된 기록 목록 -->
    <section class="card">
      <h2>📋 저장된 산책 기록</h2>
      <ul id="log-list" class="log-list">
        <!-- 저장 시 리스트 동적 추가 -->
      </ul>
    </section>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
