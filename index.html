<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반려견 맞춤 산책 앱</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>🐾 반려견 맞춤 산책 앱</h1>
  </header>

  <main>
    <!-- 지도 영역 -->
    <section id="map-container">
      <div id="map"></div>
    </section>

    <!-- 메인 설정 및 코스 관리 카드 -->
    <section class="card">
      <h2>🎯 산책 코스 설정</h2>
      
      <!-- 1. 도로명 / 지번 주소 검색 -->
      <div class="form-group">
        <label for="address-input"><b>1. 출발지 주소 검색 (도로명 / 지번)</b></label>
        <div class="search-input-group">
          <input type="text" id="address-input" placeholder="예: 황남동 172 또는 포석로 1080" value="경주시 황남동">
          <button type="button" onclick="searchAddress()">검색</button>
        </div>
        <p id="address-result-info" class="sub-text"></p>
      </div>

      <!-- 2. 코스 형태 선택 (편도 / 왕복) -->
      <div class="form-group">
        <label><b>2. 코스 형태 선택</b></label>
        <div class="button-group type-group">
          <button type="button" class="btn-type active" onclick="selectType('왕복')">🔄 왕복 (원점 회귀)</button>
          <button type="button" class="btn-type" onclick="selectType('편도')">➡️ 편도 (목적지 도착)</button>
        </div>
      </div>

      <!-- 5. 산책 목표 선택 (30분 / 1시간 / 3km / 5km / 10km) -->
      <div class="form-group">
        <label><b>3. 산책 목표 선택</b></label>
        <div class="button-group target-group">
          <button type="button" class="btn-target active" onclick="selectTarget('30분')">⏱️ 30분</button>
          <button type="button" class="btn-target" onclick="selectTarget('1시간')">⏱️ 1시간</button>
          <button type="button" class="btn-target" onclick="selectTarget('3km')">📏 3km</button>
          <button type="button" class="btn-target" onclick="selectTarget('5km')">📏 5km</button>
          <button type="button" class="btn-target" onclick="selectTarget('10km')">📏 10km</button>
        </div>
      </div>

      <!-- 3 & 4. 추천 받기 / 직접 만들기 버튼 -->
      <div class="action-btn-group">
        <button type="button" onclick="recommendCourse()" class="btn-primary">🔍 도로망 기준 추천 코스 생성</button>
        <button type="button" onclick="toggleCustomCourseMode()" id="btn-custom-mode" class="btn-secondary">✏️ 지도 클릭으로 직접 코스 만들기</button>
      </div>

      <!-- 직접 만들기 안내 및 컨트롤 바 -->
      <div id="custom-course-banner" class="custom-banner" style="display:none;">
        <p><b>[직접 만들기 모드 작동 중]</b><br>지도를 클릭하여 원하는 경유 지점들을 순서대로 찍어주세요.</p>
        <div class="button-group sub-group">
          <button type="button" onclick="undoLastCustomPoint()">↩️ 마지막 지점 취소</button>
          <button type="button" onclick="finishCustomCourse()">✅ 나만의 코스 완성</button>
          <button type="button" onclick="cancelCustomCourse()">❌ 취소</button>
        </div>
      </div>

      <!-- 결과 출력 영역 -->
      <div id="recommend-result" class="result-box" style="display:none;">
        <h3 id="result-title"></h3>
        <p id="result-desc"></p>
      </div>
    </section>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
