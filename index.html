<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경주 반려견 맞춤 산책 앱</title>
  
  <!-- Leaflet 지도 라이브러리 CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>🐾 경주 반려견 맞춤 산책 앱</h1>
  </header>

  <main>
    <!-- 지도 영역 -->
    <section id="map-container">
      <div id="map"></div>
    </section>

    <!-- 현위치 조회 버튼 -->
    <section class="card current-loc-card">
      <button id="btn-current-location" onclick="showCurrentLocation()">📍 내 현위치 조회</button>
      <p id="gps-status" class="info-text">버튼을 누르면 현재 위치를 지도에 표시합니다.</p>
    </section>

    <!-- 핵심 기능: 출발지 & 목표 선택 코스 추천 -->
    <section class="card">
      <h2>🎯 맞춤 산책 코스 추천</h2>
      
      <!-- 출발지 선택 -->
      <div class="form-group">
        <label for="start-location"><b>1. 출발지 선택</b></label>
        <select id="start-location" class="select-box">
          <option value="황남동">황남동 / 황리단길 주변</option>
          <option value="보문단지">보문관광단지 주변</option>
          <option value="불국사">불국사 / 진현동 주변</option>
          <option value="성건동">경주역 / 성건동 주변</option>
        </select>
      </div>

      <!-- 산책 목표 선택 -->
      <div class="form-group">
        <label><b>2. 산책 목표 선택</b></label>
        <div class="button-group target-group">
          <button type="button" class="btn-target" onclick="selectTarget('time', '30분')">⏱️ 30분</button>
          <button type="button" class="btn-target" onclick="selectTarget('time', '1시간')">⏱️ 1시간</button>
          <button type="button" class="btn-target" onclick="selectTarget('dist', '3km')">📏 3km</button>
          <button type="button" class="btn-target" onclick="selectTarget('dist', '5km')">📏 5km</button>
        </div>
        <div id="target-display" class="target-badge">선택된 목표: 30분</div>
      </div>

      <button onclick="recommendCourse()" class="btn-recommend">🔍 맞춤 추천 코스 검색</button>

      <!-- 추천 결과 영역 -->
      <div id="recommend-result" class="result-box" style="display:none;">
        <h3 id="result-title"></h3>
        <p id="result-desc"></p>
      </div>
    </section>

    <!-- 산책 기록 -->
    <section class="card">
      <h2>📝 오늘의 산책 기록하기</h2>
      <form id="walk-form">
        <div class="form-group">
          <label for="dog-name">반려견 이름</label>
          <input type="text" id="dog-name" placeholder="예: 초코" required>
        </div>
        <div class="form-group">
          <label for="walk-time">산책 시간 (분)</label>
          <input type="number" id="walk-time" placeholder="예: 30" required>
        </div>
        <div class="form-group">
          <label for="walk-distance">산책 거리 (km)</label>
          <input type="number" step="0.1" id="walk-distance" placeholder="예: 2.5">
        </div>
        <div class="form-group">
          <label for="walk-memo">산책 일지/메모</label>
          <textarea id="walk-memo" rows="3" placeholder="오늘 추천 코스는 어땠나요? 방문한 카페나 소감을 적어보세요."></textarea>
        </div>
        <button type="submit" class="btn-submit">기록 저장하기</button>
      </form>
    </section>

    <!-- 저장된 기록 목록 -->
    <section class="card">
      <h2>📋 저장된 산책 기록</h2>
      <ul id="log-list" class="log-list">
        <!-- 기록 추가 영역 -->
      </ul>
    </section>
  </main>

  <!-- Leaflet 지도 라이브러리 JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
