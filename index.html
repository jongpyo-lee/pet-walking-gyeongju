<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경주 반려견 산책 앱</title>
  
  <!-- Leaflet 지도 라이브러리 CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>🐾 경주 반려견 산책 앱</h1>
  </header>

  <main>
    <!-- 지도 영역 -->
    <section id="map-container">
      <div id="map"></div>
    </section>

    <!-- GPS 트래킹 및 컨트롤 -->
    <section class="card">
      <h2>📍 GPS 실시간 산책 트래킹</h2>
      <div class="button-group">
        <button id="btn-gps-start" onclick="toggleTracking()">▶️ 산책 시작 (GPS 추적)</button>
        <button id="btn-gps-reset" onclick="resetTracking()" style="display:none;">🔄 동선 리셋</button>
      </div>
      <p id="gps-status" class="info-text">버튼을 누르면 현재 위치 추적과 산책 경로 기록이 시작됩니다.</p>
    </section>

    <!-- 목표 설정 (시간/거리) 및 코스 추천 -->
    <section class="card">
      <h2>🎯 목표 설정 & 추천 산책 코스</h2>
      
      <!-- 목표 선택 -->
      <div class="target-selection">
        <label><b>산책 목표 선택:</b></label>
        <div class="button-group sub-group">
          <button type="button" class="btn-target" onclick="setTarget('time', '30분')">⏱️ 30분</button>
          <button type="button" class="btn-target" onclick="setTarget('time', '1시간')">⏱️ 1시간</button>
          <button type="button" class="btn-target" onclick="setTarget('dist', '3km')">📏 3km</button>
          <button type="button" class="btn-target" onclick="setTarget('dist', '5km')">📏 5km</button>
          <button type="button" class="btn-target" onclick="setTarget('dist', '10km')">📏 10km</button>
        </div>
        <div id="target-display" class="target-badge">선택된 목표: 없음</div>
      </div>

      <hr class="divider">

      <!-- 코스 버튼 -->
      <label><b>경주 추천 코스 보기:</b></label>
      <div class="button-group">
        <button onclick="showRoute('황성공원')">🌳 황성공원</button>
        <button onclick="showRoute('보문호수')">🌊 보문호수</button>
        <button onclick="showRoute('동궁과월지')">🌸 동궁과 월지</button>
      </div>
      <p id="route-info" class="info-text">추천 코스를 클릭하면 지도가 해당 위치로 이동합니다.</p>
    </section>

    <!-- 산책 기록 -->
    <section class="card">
      <h2>📝 오늘의 산책 기록하기</h2>
      <form id="walk-form">
        <div class="form-group">
          <label for="dog-name">반려견 이름</label>
          <input type="text" id="dog-name" placeholder="예: 초코" required>
        </div>
        <div class="form-group">
          <label for="walk-time">실제 산책 시간 (분)</label>
          <input type="number" id="walk-time" placeholder="예: 30" required>
        </div>
        <div class="form-group">
          <label for="walk-distance">산책 거리 (km)</label>
          <input type="number" step="0.1" id="walk-distance" placeholder="예: 2.5">
        </div>
        <div class="form-group">
          <label for="walk-memo">산책 일지/메모</label>
          <textarea id="walk-memo" rows="3" placeholder="오늘 방문한 카페나 산책 소감을 적어보세요!"></textarea>
        </div>
        <button type="submit" class="btn-submit">기록 저장하기</button>
      </form>
    </section>

    <!-- 저장된 기록 목록 -->
    <section class="card">
      <h2>📋 저장된 산책 기록</h2>
      <ul id="log-list" class="log-list">
        <!-- 기록 추가 영역 -->
      </ul>
    </section>
  </main>

  <!-- Leaflet 지도 라이브러리 JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
